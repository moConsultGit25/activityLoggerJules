# gcp_configs/cloudrun/service.yaml
# Example Cloud Run service definition.
# This file provides a declarative way to define your Cloud Run service.
#
# How to use:
# 1. Replace placeholders (like YOUR_PROJECT_ID, YOUR_CLOUD_RUN_SERVICE_ACCOUNT_EMAIL,
#    image URI, and specific secret names if they differ from the examples)
#    with your actual values.
# 2. For initial deployment or to replace an existing service configuration:
#    gcloud run services replace gcp_configs/cloudrun/service.yaml --region YOUR_REGION
#
# Note on interaction with Cloud Build:
# - This service.yaml can define the comprehensive configuration for your Cloud Run service.
# - The 'gcloud run deploy' command in cloudbuild.yaml primarily updates the container image.
#   If other settings (like environment variables, CPU, memory) are defined here and not
#   explicitly overridden in the 'gcloud run deploy' command in cloudbuild.yaml,
#   they will persist from the last 'gcloud run services replace' or initial setup.
#   It's good practice to ensure your CI/CD pipeline's deploy step is comprehensive
#   or to periodically use 'gcloud run services replace' with this file to manage configuration drift.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: 'activity-logger-backend' # Replace with your actual service name (e.g., same as _SERVICE_NAME in cloudbuild.yaml)
  namespace: 'YOUR_PROJECT_ID'    # IMPORTANT: Replace with your GCP Project ID
  labels:
    # Example labels, adjust as needed
    app: activity-logger
    env: production # Or staging, dev, etc.
    # Ensure this region matches the one you deploy to
    cloud.googleapis.com/location: 'us-central1' # IMPORTANT: Replace with your Cloud Run region
spec:
  template:
    metadata:
      annotations:
        # Scaling annotations
        autoscaling.knative.dev/minScale: '0' # Minimum number of container instances (0 for scale-to-zero)
        autoscaling.knative.dev/maxScale: '3' # Maximum number of container instances
        # Other annotations like VPC connector, CPU always allocated, etc. can be added here.
        # run.googleapis.com/cpu-throttling: 'false' # Use 'true' to throttle CPU when not processing requests (default)
        # run.googleapis.com/startup-cpu-boost: 'true' # For faster cold starts (if needed)
    spec:
      # Replace with the email of the service account Cloud Run should use.
      # Ensure this service account has permissions for Secret Manager, Logging, Monitoring, etc.
      # If omitted, uses the default Compute Engine service account.
      serviceAccountName: 'YOUR_CLOUD_RUN_SERVICE_ACCOUNT_EMAIL' # IMPORTANT: Replace or remove if using default

      containerConcurrency: 80 # Max concurrent requests per container instance
      timeoutSeconds: 300      # Max request processing time

      containers:
        - image: 'us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_ARTIFACT_REGISTRY_REPO/YOUR_SERVICE_NAME:latest' # IMPORTANT: Replace with your image URI
          ports:
            - name: http1 # Default port name for HTTP/1 traffic
              containerPort: 8000 # Port your application listens on (defined in Dockerfile EXPOSE and CMD)
          resources:
            limits:
              cpu: '1000m'    # 1 vCPU
              memory: '512Mi' # 512 Megabytes of RAM
            # requests: (Optional, usually not needed for Cloud Run as limits are primary)
            #   cpu: '250m'
            #   memory: '256Mi'
          env:
            # Environment variables sourced from Google Secret Manager
            # The Cloud Run runtime service account needs the "Secret Manager Secret Accessor" role
            # on these specific secrets or on the project/folder level.
            # IMPORTANT: Replace SECRET_NAME placeholders with the actual names of your secrets in Secret Manager.
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: 'MONGO_URI_ACTIVITY_LOGGER', key: 'latest' } }
            - name: AUTH_MONGO_DB_NAME
              valueFrom: { secretKeyRef: { name: 'AUTH_MONGO_DB_NAME_ACTIVITY_LOGGER', key: 'latest' } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: 'JWT_SECRET_KEY_ACTIVITY_LOGGER', key: 'latest' } }
            - name: AZURE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: 'AZURE_CLIENT_ID_ACTIVITY_LOGGER', key: 'latest' } }
            - name: AZURE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: 'AZURE_CLIENT_SECRET_ACTIVITY_LOGGER', key: 'latest' } }
            - name: AZURE_TENANT_ID
              valueFrom: { secretKeyRef: { name: 'AZURE_TENANT_ID_ACTIVITY_LOGGER', key: 'latest' } }
            - name: GRAPH_TARGET_USER_ID
              valueFrom: { secretKeyRef: { name: 'GRAPH_TARGET_USER_ID_ACTIVITY_LOGGER', key: 'latest' } }

            # Non-secret environment variables can also be set directly or from secrets
            - name: GRAPH_MAIL_FOLDER
              value: 'Inbox' # Default value, can be overridden by a secret if needed
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: '30'    # Default value, can be overridden by a secret if needed

            # PYTHONUNBUFFERED and PYTHONPATH are set in Dockerfile.prod.
            # They can be overridden here if necessary, but usually not required.
            # - name: PYTHONUNBUFFERED
            #   value: '1'
            # - name: PYTHONPATH
            #   value: '/app'

          # Optional: Startup probe to check if the container has started successfully
          # startupProbe:
          #   timeoutSeconds: 240
          #   periodSeconds: 10
          #   failureThreshold: 10
          #   httpGet:
          #     path: "/" # Your application's root path or a health check endpoint
          #     port: 8000
```
