{% extends "layout.html" %}

{% block title %}Register - {{ super() }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Register New Account</h2>

        {% if error_message %}
            <div class="alert alert-danger" role="alert">
                {{ error_message }}
            </div>
        {% endif %}
        {% if success_message %}
            <div class="alert alert-success" role="alert">
                {{ success_message }}
            </div>
        {% endif %}

        <form method="post" action="{{ request.url_for('handle_registration_form') }}">
            <div class="form-group">
                <label for="username">Username (Email)</label>
                <input type="email" class="form-control" id="username" name="username"
                       value="{{ request.form.get('username', '') if request.form else '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password (min 8 characters)</label>
                <input type="password" class="form-control" id="password" name="password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" class="form-control" id="password_confirm" name="password_confirm" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="mt-3">
            Already have an account?
            <a href="{{ request.url_for('serve_login_page') if request.url_for('serve_login_page') else '#' }}">Login here</a>.
        </p>
    </div>
</div>
{% endblock %}
